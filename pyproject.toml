[project]
name = "expplatform"
version = "0.1.0"
description = "A/B testing and causal inference platform — portfolio project"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "econml>=0.15",
    "scikit-learn>=1.5",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.36",
    "duckdb>=1.0",
    "pyarrow>=16.0",
    "requests>=2.32",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",          # async test client for FastAPI
    "pre-commit>=3.7",
]

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ── Ruff (linter + formatter) ──────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

# ── Pytest ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "e2e: end-to-end tests (deselect with -m 'not e2e')",
]
